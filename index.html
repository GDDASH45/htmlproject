<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HTML Project">
  <title>HTML Project</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #10131a;
      color: #f1f5f9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    main {
      width: min(100%, 720px);
      padding: 3rem;
      border: 1px solid #303847;
      border-radius: 16px;
      background: #191f2b;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: clamp(2rem, 7vw, 3.5rem);
    }

    p {
      color: #b8c2d1;
      line-height: 1.7;
    }

    a {
      color: #8ab4ff;
    }
  </style>
</head>
<body>
  <main>
    <h1>HTML Project</h1>
    <p>Welcome to my website!</p>
    <p>This site is hosted with GitHub Pages.</p>
  </main>
</body>
</html>
