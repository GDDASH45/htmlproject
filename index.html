<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple, welcoming home page built with HTML and CSS.">
  <meta name="theme-color" content="#10131a">
  <title>HTML Project | Welcome</title>
  <title>HTML Project</title>
  <style>

    * { box-sizing: border-box; }


    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #eef2ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --surface: #121a2d;
      --surface-raised: #18233b;
      --border: #293650;
      --muted: #aab6ce;
      --accent: #9bb8ff;
      --accent-strong: #c2d2ff;
    }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background: radial-gradient(ellipse at 50% -20%, #1b2b50 0%, #0b1020 55%);
    }

    a { color: var(--accent); }
    a:hover { color: var(--accent-strong); }

    .container {
      width: min(100% - 2rem, 1080px);
      margin-inline: auto;
    }
    .site-header {
      border-bottom: 1px solid rgb(169 190 230 / 12%);
      background: rgb(11 16 32 / 78%);
    }

    .header-inner {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .brand {
      color: #eef2ff;
      font-weight: 750;
      letter-spacing: -0.04em;
      text-decoration: none;
    }
    .site-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
    }

    .site-nav a {
      color: var(--muted);
      font-size: 0.92rem;
      text-decoration: none;
    }

    .site-nav a:hover { color: #fff; }

    .header-note {
      color: var(--muted);
      font-size: 0.88rem;
    }
  </style>
</head>
<body>

<header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#top">HTML Project</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="#about">About</a>
        <a href="#features">Features</a>
        <a href="#start">Get started</a>
        <a href="#resources">Resources</a>
        <a href="#faq">FAQ</a>
      </nav>
    </div>
  </header>

<main>

  <h1>HTML Project</h1>
  <p>Welcome to my website!</p>
  <p>This site is hosted with GitHub Pages.</p>

</main>


</body>
</html>
